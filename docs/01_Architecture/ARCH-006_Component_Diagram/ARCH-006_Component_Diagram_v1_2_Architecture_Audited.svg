<rect x="25" y="1145" width="1850" height="135" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="45" y="1170" text-anchor="start" class="t layer">INTERPRETATION RULES</text><text x="45" y="1195" text-anchor="start" class="t legend">• Event Engine coexists with explicit command/query/use-case contracts; it is not a universal bus or RPC transport.</text><text x="45" y="1217" text-anchor="start" class="t legend">• Game Adapter does not import domain implementations; Game Ingress and Game Output/Capability ports prevent a concrete implementation cycle.</text><text x="45" y="1239" text-anchor="start" class="t legend">• Save Manager owns Save/Restore; ordinary domain persistence uses owned repository ports. Scheduler triggers autosave through Event Engine.</text><text x="45" y="1261" text-anchor="start" class="t legend">• AI requests enter through AI Adapter. Context Manager has no direct Repository/SQLite access. Host wiring is not a Service Locator.</text></svg>